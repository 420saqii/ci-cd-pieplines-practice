name: Flutter Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Use Flutter 3.32.0
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}

      # Java 17 helps modern AGP
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # Node 20 for firebase-tools
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # ✅ Distribute using service account authentication (no gcloud required)
      - name: Deploy to Firebase App Distribution
        if: github.event_name == 'push'  # optional, skip on PRs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.SAQIB }}  # raw JSON
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          set -euo pipefail
          
          # Write service account JSON to file
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/key.json"
          
          # Verify APK exists
          echo "APK file details:"
          ls -la build/app/outputs/flutter-apk/app-release.apk
          
          # Install googleapis locally in current directory
          echo "Installing googleapis locally..."
          npm init -y > /dev/null 2>&1
          npm install googleapis --silent
          
          # Generate access token from service account using Node.js
          echo "Generating access token from service account..."
          TOKEN_FILE="$RUNNER_TEMP/token.txt"
          KEY_FILE="$RUNNER_TEMP/key.json"
          
          node <<EOF
            const { google } = require('googleapis');
            const fs = require('fs');
            
            const keyPath = '$KEY_FILE';
            const tokenPath = '$TOKEN_FILE';
            
            // Verify key file exists
            if (!fs.existsSync(keyPath)) {
              console.error('Error: Key file not found:', keyPath);
              process.exit(1);
            }
            
            // Read and parse key file
            let key;
            try {
              const keyContent = fs.readFileSync(keyPath, 'utf8');
              key = JSON.parse(keyContent);
            } catch (err) {
              console.error('Error reading/parsing key file:', err.message);
              process.exit(1);
            }
            
            // Verify required fields exist
            if (!key.client_email) {
              console.error('Error: client_email not found in key file');
              process.exit(1);
            }
            
            if (!key.private_key) {
              console.error('Error: private_key not found in key file');
              process.exit(1);
            }
            
            // Fix private key: replace escaped newlines with actual newlines
            // JSON.parse might have already converted \\n to \n, so we need to handle both
            let privateKey = key.private_key;
            if (typeof privateKey === 'string') {
              // Replace literal \n (backslash followed by n) with actual newlines
              privateKey = privateKey.replace(/\\n/g, '\n');
              // Also handle if newlines are already escaped in the string
              privateKey = privateKey.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
            }
            
            // Debug: Check if private key looks valid (should start with BEGIN)
            if (!privateKey.includes('BEGIN')) {
              console.error('Warning: Private key might be malformed');
              console.error('First 50 chars:', privateKey.substring(0, 50));
            }
            
            // Create JWT client - try using keyFile first (more reliable)
            // If that doesn't work, fall back to key option
            let jwtClient;
            try {
              // Try with keyFile option (most reliable)
              jwtClient = new google.auth.JWT({
                keyFile: keyPath,
                scopes: [
                  'https://www.googleapis.com/auth/firebase',
                  'https://www.googleapis.com/auth/cloud-platform'
                ]
              });
            } catch (err) {
              // Fall back to passing key directly
              console.log('Using key option instead of keyFile');
              jwtClient = new google.auth.JWT({
                email: key.client_email,
                key: privateKey,
                scopes: [
                  'https://www.googleapis.com/auth/firebase',
                  'https://www.googleapis.com/auth/cloud-platform'
                ]
              });
            }
            
            // Use async/await properly - wait for token generation
            (async () => {
              try {
                const tokens = await jwtClient.authorize();
                if (!tokens || !tokens.access_token) {
                  console.error('Error: No access token received');
                  process.exit(1);
                }
                fs.writeFileSync(tokenPath, tokens.access_token);
                console.log('Token generated successfully');
                process.exit(0);
              } catch (err) {
                console.error('Error authorizing:', err.message);
                console.error('Stack:', err.stack);
                process.exit(1);
              }
            })();
          EOF
          
          if [ ! -f "$TOKEN_FILE" ]; then
            echo "Error: Failed to generate access token"
            exit 1
          fi
          
          TOKEN=$(cat "$TOKEN_FILE")
          
          if [ -z "$TOKEN" ]; then
            echo "Error: Token file is empty"
            exit 1
          fi
          
          echo "Token generated successfully"
          
          # Distribute to Firebase App Distribution with token
          firebase appdistribution:distribute \
            build/app/outputs/flutter-apk/app-release.apk \
            --app "$FIREBASE_APP_ID" \
            --groups "testers" \
            --release-notes "Automated build #${{ github.run_number }}" \
            --token "$TOKEN"
