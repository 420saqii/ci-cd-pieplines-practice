name: Flutter Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Use Flutter 3.32.0
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}

      # Java 17 helps modern AGP
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # Node 20 for firebase-tools
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # ✅ Distribute using service account authentication (no gcloud required)
      - name: Deploy to Firebase App Distribution
        if: github.event_name == 'push'  # optional, skip on PRs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.SAQIB }}  # raw JSON
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          set -euo pipefail
          
          # Write service account JSON to file
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/key.json"
          
          # Verify APK exists
          echo "APK file details:"
          ls -la build/app/outputs/flutter-apk/app-release.apk
          
          # Install googleapis locally in current directory
          echo "Installing googleapis locally..."
          npm init -y > /dev/null 2>&1
          npm install googleapis --silent
          
          # Generate access token from service account using Node.js
          echo "Generating access token from service account..."
          TOKEN_FILE="$RUNNER_TEMP/token.txt"
          KEY_FILE="$RUNNER_TEMP/key.json"
          
          node <<EOF
            const { google } = require('googleapis');
            const fs = require('fs');
            
            const keyPath = '$KEY_FILE';
            const tokenPath = '$TOKEN_FILE';
            
            const key = JSON.parse(fs.readFileSync(keyPath, 'utf8'));
            
            const jwtClient = new google.auth.JWT(
              key.client_email,
              null,
              key.private_key,
              [
                'https://www.googleapis.com/auth/firebase',
                'https://www.googleapis.com/auth/cloud-platform'
              ]
            );
            
            // Use async/await properly - wait for token generation
            (async () => {
              try {
                const tokens = await jwtClient.authorize();
                fs.writeFileSync(tokenPath, tokens.access_token);
                process.exit(0);
              } catch (err) {
                console.error('Error authorizing:', err);
                process.exit(1);
              }
            })();
          EOF
          
          if [ ! -f "$TOKEN_FILE" ]; then
            echo "Error: Failed to generate access token"
            exit 1
          fi
          
          TOKEN=$(cat "$TOKEN_FILE")
          
          if [ -z "$TOKEN" ]; then
            echo "Error: Token file is empty"
            exit 1
          fi
          
          echo "Token generated successfully"
          
          # Distribute to Firebase App Distribution with token
          firebase appdistribution:distribute \
            build/app/outputs/flutter-apk/app-release.apk \
            --app "$FIREBASE_APP_ID" \
            --groups "testers" \
            --release-notes "Automated build #${{ github.run_number }}" \
            --token "$TOKEN"
